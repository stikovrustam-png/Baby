<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Killed</title>
<style>
:root{box-sizing:border-box;--bg:#000;--text:#fff;--accent:#4aa3ff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--text:#fff}}
:root[data-theme="dark"]{--bg:#000;--text:#fff}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;outline:none}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.view{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:1;padding:24px}
.view.active{display:flex}
.title{font-size:clamp(34px,11vw,72px);font-weight:800;letter-spacing:.04em;color:rgba(255,255,255,.28);text-align:center;user-select:none}
.settings{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:16px}
.sw{width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,.2);position:relative;cursor:pointer;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;display:flex;padding:6px;gap:4px;width:min(320px,calc(100% - 32px));border-radius:36px;background:rgba(38,38,40,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 10px 30px rgba(0,0,0,.7);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.pill{position:absolute;top:6px;bottom:6px;left:0;width:50%;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.1);transition:transform .4s cubic-bezier(.3,1.35,.5,1),top .25s,bottom .25s,background .25s,box-shadow .25s,border-color .25s}
.pill.drag{top:-7px;bottom:-7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(2px) brightness(1.3) saturate(1.6);-webkit-backdrop-filter:blur(2px) brightness(1.3) saturate(1.6);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),inset 0 -1px 1px rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.55);transition:top .25s,bottom .25s,background .25s,box-shadow .25s,border-color .25s}
.pill::before{content:"";position:absolute;inset:0;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 50%);pointer-events:none}
nav button{position:relative;flex:1;background:none;border:0;color:rgba(255,255,255,.6);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;cursor:pointer;transition:color .2s}
nav button.active{color:var(--accent)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<canvas id="c"></canvas>

<section class="view active" id="v0"><div class="title">Baby Killed</div></section>
<section class="view" id="v1">
  <div class="settings">
    <div class="row">Снег<div class="sw on" id="sSnow"></div></div>
    <div class="row">Надпись<div class="sw on" id="sText"></div></div>
    <div class="row" id="net" style="cursor:pointer"><span>Сеть</span><span id="netSt" style="font-size:14px;color:rgba(255,255,255,.6);text-align:right">нажми, проверить</span></div>
  </div>
</section>

<nav id="nav" data-tab="0">
  <div class="pill"></div>
  <button class="active" data-t="0"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button data-t="1"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Настройки</button>
</nav>

<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,flakes=[],snow=true;
function resize(){var d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
resize();addEventListener('resize',resize);
function mk(top){return{x:Math.random()*W,y:top?-5:Math.random()*H,r:Math.random()*2.2+.6,v:Math.random()*.9+.4,s:Math.random()*Math.PI*2,a:Math.random()*.6+.35}}
for(var i=0;i<140;i++)flakes.push(mk(false));
function tick(){
  ctx.clearRect(0,0,W,H);
  if(snow){
    for(var i=0;i<flakes.length;i++){
      var f=flakes[i];f.y+=f.v;f.s+=.01;f.x+=Math.sin(f.s)*.4;
      if(f.y>H+5){flakes[i]=mk(true);continue}
      ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fillStyle='rgba(255,255,255,'+f.a+')';ctx.fill();
    }
  }
  requestAnimationFrame(tick);
}
tick();
var nav=document.getElementById('nav'),btns=nav.querySelectorAll('button');
var pill=nav.querySelector('.pill'),cur=0,dragging=false,hover=0;
function geo(){var t=(nav.clientWidth-12)/2;return{t:t,pw:t+10}}
function setX(x){pill.style.transform='translateX('+x+'px)'}
function mark(i){btns.forEach(function(x,k){x.classList.toggle('active',k===i)})}
function snap(){var g=geo();pill.style.width=g.pw+'px';setX(6+cur*g.t-5)}
function select(i){cur=i;mark(i);document.getElementById('v0').classList.toggle('active',i===0);document.getElementById('v1').classList.toggle('active',i===1);snap()}
function move(e){var r=nav.getBoundingClientRect(),g=geo();var x=e.clientX-r.left-g.pw/2;x=Math.max(1,Math.min(r.width-g.pw-1,x));setX(x);hover=(x+g.pw/2)<r.width/2?0:1;mark(hover)}
nav.addEventListener('pointerdown',function(e){dragging=true;try{nav.setPointerCapture(e.pointerId)}catch(_){}pill.classList.add('drag');pill.style.transition='top .25s,bottom .25s,background .25s,box-shadow .25s,border-color .25s';move(e)});
nav.addEventListener('pointermove',function(e){if(dragging)move(e)});
function up(){if(!dragging)return;dragging=false;pill.classList.remove('drag');pill.style.transition='';select(hover)}
nav.addEventListener('pointerup',up);nav.addEventListener('pointercancel',up);
addEventListener('resize',snap);snap();
['contextmenu','selectstart','dragstart'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});
document.getElementById('sSnow').onclick=function(){snow=!snow;this.classList.toggle('on',snow)};
document.getElementById('sText').onclick=function(){var t=document.querySelector('.title');var on=this.classList.toggle('on');t.style.visibility=on?'visible':'hidden'};
var netSt=document.getElementById('netSt');
function ping(url,mode){var c=new AbortController();var t=setTimeout(function(){c.abort()},8000);return fetch(url,{mode:mode,cache:'no-store',signal:c.signal}).then(function(r){clearTimeout(t);return true}).catch(function(){clearTimeout(t);return false})}
document.getElementById('net').addEventListener('click',function(){
  netSt.textContent='проверяю…';netSt.style.color='rgba(255,255,255,.6)';
  Promise.all([ping('https://api.github.com/zen','cors'),ping('https://baby.gt.tc/','no-cors')]).then(function(r){
    netSt.innerHTML='интернет: '+(r[0]?'есть':'нет')+'<br>baby.gt.tc: '+(r[1]?'отвечает':'не отвечает');
    netSt.style.color=r[0]?'#4aa3ff':'#ff6b6b';
  });
});
</script>
</body>
</html>
